<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Done</title>
<meta name="theme-color" content="#0a0e16">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%233b82f6%22/><path d=%22M28 52l16 16 28-34%22 stroke=%22white%22 stroke-width=%2210%22 fill=%22none%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%233b82f6%22/><path d=%22M28 52l16 16 28-34%22 stroke=%22white%22 stroke-width=%2210%22 fill=%22none%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#0a0e16;
    --surface:#11151f;
    --surface2:#171d2b;
    --surface3:#1f2634;
    --border:#242c3d;
    --text:#eef1f7;
    --text-dim:#8792a6;
    --text-faint:#525c72;
    --accent:#3b82f6;
    --accent-dim:#1d3a66;
    --accent-glow:#60a5fa;
    --radius:16px;
    --radius-sm:10px;
    color-scheme: dark;
  }
  :root.light{
    --bg:#f4f6fa;
    --surface:#ffffff;
    --surface2:#eef1f7;
    --surface3:#e4e8f0;
    --border:#dde2ec;
    --text:#141822;
    --text-dim:#5c6479;
    --text-faint:#9aa2b5;
    --accent:#2563eb;
    --accent-dim:#dbe7ff;
    --accent-glow:#3b82f6;
    color-scheme: light;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Outfit',system-ui,sans-serif;
    overscroll-behavior-y:none;
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:640px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-bottom:88px;}

  /* ---------- Header ---------- */
  header.topbar{
    position:sticky;top:0;z-index:20;
    background:color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--border);
    padding:calc(env(safe-area-inset-top) + 14px) 18px 14px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{width:30px;height:30px;border-radius:9px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .brand-mark svg{width:16px;height:16px;}
  .brand-name{font-weight:700;font-size:19px;letter-spacing:-0.02em;}
  .icon-btn{
    width:38px;height:38px;border-radius:12px;border:1px solid var(--border);
    background:var(--surface2);display:flex;align-items:center;justify-content:center;
    color:var(--text-dim);cursor:pointer;transition:.15s;flex-shrink:0;
  }
  .icon-btn:active{transform:scale(.92);background:var(--surface3);}
  .icon-btn svg{width:18px;height:18px;}
  .header-actions{display:flex;gap:8px;}

  /* ---------- Tabs (bottom nav) ---------- */
  nav.tabbar{
    position:fixed;bottom:0;left:0;right:0;z-index:30;
    max-width:640px;margin:0 auto;
    background:color-mix(in srgb, var(--bg) 90%, transparent);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border-top:1px solid var(--border);
    display:flex;padding:8px 10px calc(env(safe-area-inset-bottom) + 8px);
    gap:4px;
  }
  .tab-btn{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;
    padding:8px 4px;border-radius:12px;color:var(--text-faint);
    background:none;border:none;font-family:inherit;font-size:11px;font-weight:600;
    cursor:pointer;transition:.15s;
  }
  .tab-btn svg{width:21px;height:21px;}
  .tab-btn.active{color:var(--accent);}
  .tab-btn:active{transform:scale(.94);}

  main{flex:1;padding:18px;}
  .view{display:none;animation:fadein .2s ease;}
  .view.active{display:block;}
  @keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

  /* ---------- Today view ---------- */
  .today-hero{
    background:linear-gradient(155deg, var(--surface2), var(--surface));
    border:1px solid var(--border);border-radius:var(--radius);
    padding:22px;margin-bottom:20px;display:flex;align-items:center;gap:18px;
  }
  .ring-wrap{position:relative;width:76px;height:76px;flex-shrink:0;}
  .ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg);}
  .ring-bg{fill:none;stroke:var(--surface3);stroke-width:8;}
  .ring-fg{fill:none;stroke:var(--accent);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .5s ease;}
  .ring-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;}
  .hero-text-date{font-size:13px;color:var(--text-dim);text-transform:capitalize;margin-bottom:2px;}
  .hero-text-title{font-size:19px;font-weight:700;letter-spacing:-0.01em;}
  .hero-text-sub{font-size:13px;color:var(--text-dim);margin-top:4px;}

  .task-card{
    display:flex;align-items:center;gap:12px;
    background:var(--surface);border:1.5px solid var(--border);
    border-radius:12px;padding:9px 10px;margin-bottom:7px;
    transition:.15s;
  }
  .task-check{
    width:34px;height:34px;border-radius:10px;flex-shrink:0;
    border:2px solid var(--surface3);background:var(--surface2);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    transition:.15s;
  }
  .task-check svg{width:16px;height:16px;opacity:0;transition:.15s;stroke:#fff;}
  .task-check.done{border-color:transparent;}
  .task-check.done svg{opacity:1;}
  .task-check:active{transform:scale(.9);}
  .task-info{flex:1;min-width:0;}
  .task-name{font-weight:600;font-size:14px;}
  .task-meta{font-size:12px;color:var(--text-faint);display:flex;align-items:center;gap:6px;}
  .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
  .goal-pill{
    font-size:11px;font-weight:600;color:var(--text-dim);
    background:var(--surface2);border:1px solid var(--border);
    padding:3px 8px;border-radius:20px;white-space:nowrap;
  }
  .goal-pill.met{color:var(--accent-glow);border-color:var(--accent-dim);}
  .empty-state{text-align:center;padding:60px 20px;color:var(--text-faint);}
  .empty-state svg{width:44px;height:44px;margin-bottom:14px;opacity:.5;}
  .empty-state p{font-size:14px;line-height:1.5;}

  /* ---------- History/grid view ---------- */
  .grid-scroll{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);-webkit-overflow-scrolling:touch;}
  table.habit-grid{border-collapse:collapse;width:100%;min-width:560px;}
  table.habit-grid th, table.habit-grid td{padding:0;text-align:center;}
  .col-task{
    position:sticky;left:0;z-index:5;background:var(--surface);
    text-align:left !important;padding:12px 14px !important;min-width:150px;max-width:150px;
    border-right:1px solid var(--border);
  }
  .col-task .task-name{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:7px;}
  .day-head{padding:12px 4px !important;font-size:11px;color:var(--text-dim);font-weight:600;min-width:52px;border-bottom:1px solid var(--border);}
  .day-head .dow{display:block;}
  .day-head .dnum{display:block;font-size:14px;color:var(--text);margin-top:2px;}
  .day-head.today{color:var(--accent-glow);}
  .pct-row td{padding:10px 4px !important;font-size:11.5px;font-weight:700;background:var(--surface2);border-bottom:1px solid var(--border);}
  .pct-row .col-task{background:var(--surface2);font-size:11px;color:var(--text-dim);font-weight:600;}
  .grid-cell{padding:10px 0 !important;border-bottom:1px solid var(--border);}
  .grid-check{
    width:30px;height:30px;border-radius:9px;margin:0 auto;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    background:var(--surface2);border:1.5px solid var(--surface3);transition:.12s;
  }
  .grid-check svg{width:14px;height:14px;opacity:0;stroke:#fff;}
  .grid-check.done{border-color:transparent;}
  .grid-check.done svg{opacity:1;}
  .grid-check.future{opacity:.25;pointer-events:none;}
  .grid-check:active{transform:scale(.85);}
  .grid-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .grid-nav-label{font-weight:700;font-size:15px;text-transform:capitalize;}
  .grid-nav-btns{display:flex;gap:8px;}

  /* ---------- Analytics view ---------- */
  .section-title{font-size:13px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:.04em;margin:24px 0 12px;}
  .section-title:first-child{margin-top:0;}
  .chart-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:6px;}
  .stat-row{display:flex;gap:10px;margin-bottom:6px;}
  .stat-box{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;text-align:center;}
  .stat-box .num{font-size:22px;font-weight:800;letter-spacing:-0.02em;}
  .stat-box .lbl{font-size:11px;color:var(--text-faint);margin-top:2px;}
  .rank-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border);}
  .rank-row:last-child{border-bottom:none;}
  .rank-name{flex:1;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:8px;min-width:0;}
  .rank-name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .rank-bar-wrap{flex:1.4;height:7px;background:var(--surface3);border-radius:10px;overflow:hidden;}
  .rank-bar{height:100%;background:var(--accent);border-radius:10px;}
  .rank-pct{font-size:12.5px;font-weight:700;color:var(--text-dim);width:38px;text-align:right;flex-shrink:0;}

  /* ---------- Modal / Edit ---------- */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(2px);
    z-index:50;display:none;align-items:flex-end;justify-content:center;
  }
  .modal-backdrop.open{display:flex;}
  .modal-sheet{
    background:var(--bg);width:100%;max-width:640px;max-height:88vh;overflow-y:auto;
    border-radius:22px 22px 0 0;border:1px solid var(--border);border-bottom:none;
    padding:10px 20px calc(env(safe-area-inset-bottom) + 24px);
    animation:slideup .25s ease;
  }
  @keyframes slideup{from{transform:translateY(100%);}to{transform:translateY(0);}}
  .sheet-handle{width:38px;height:4px;background:var(--surface3);border-radius:4px;margin:6px auto 16px;}
  .sheet-title{font-size:18px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--text-dim);margin-bottom:6px;}
  .field input, .field select{
    width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);
    padding:12px 13px;border-radius:11px;font-family:inherit;font-size:14.5px;outline:none;
  }
  .field input:focus, .field select:focus{border-color:var(--accent);}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .color-swatches{display:flex;gap:9px;flex-wrap:wrap;}
  .swatch{width:32px;height:32px;border-radius:50%;cursor:pointer;border:2.5px solid transparent;transition:.12s;}
  .swatch.sel{border-color:var(--text);transform:scale(1.1);}
  .btn{
    width:100%;padding:14px;border-radius:12px;border:none;font-family:inherit;
    font-weight:700;font-size:14.5px;cursor:pointer;transition:.15s;
  }
  .btn:active{transform:scale(.98);}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border);}
  .btn-danger-text{background:none;border:none;color:#ef4444;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;padding:8px;}
  .existing-task-row{
    display:flex;align-items:center;gap:12px;padding:12px;
    background:var(--surface);border:1.5px solid var(--border);border-radius:12px;margin-bottom:9px;
  }
  .existing-task-row .dot{width:11px;height:11px;}
  .existing-task-row .info{flex:1;min-width:0;}
  .existing-task-row .info .n{font-weight:600;font-size:14px;}
  .existing-task-row .info .m{font-size:11.5px;color:var(--text-faint);margin-top:2px;}
  .row-actions{display:flex;gap:6px;}
  .row-actions button{
    width:32px;height:32px;border-radius:9px;border:1px solid var(--border);background:var(--surface2);
    display:flex;align-items:center;justify-content:center;color:var(--text-dim);cursor:pointer;
  }
  .row-actions svg{width:15px;height:15px;}
  .divider{height:1px;background:var(--border);margin:22px 0;}

  /* ---------- Login ---------- */
  .login-screen{
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:40px 30px;text-align:center;gap:26px;
  }
  .login-mark{width:72px;height:72px;border-radius:20px;background:var(--accent);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 30px -8px var(--accent);}
  .login-mark svg{width:36px;height:36px;}
  .login-title{font-size:26px;font-weight:800;letter-spacing:-0.02em;}
  .login-sub{color:var(--text-dim);font-size:14.5px;line-height:1.5;max-width:280px;}
  .google-btn{
    display:flex;align-items:center;justify-content:center;gap:10px;
    background:#fff;color:#1f1f1f;border:none;border-radius:12px;
    padding:13px 24px;font-family:inherit;font-weight:600;font-size:14.5px;cursor:pointer;
  }
  .google-btn:active{transform:scale(.98);}
  .toast{
    position:fixed;bottom:100px;left:50%;transform:translateX(-50%);
    background:var(--surface3);color:var(--text);padding:11px 20px;border-radius:30px;
    font-size:13px;font-weight:600;z-index:60;opacity:0;pointer-events:none;transition:.25s;
    border:1px solid var(--border);white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
  #loading-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:100;}
  .spinner{width:26px;height:26px;border:3px solid var(--surface3);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<div id="loading-screen"><div class="spinner"></div></div>

<div id="login-screen" class="login-screen" style="display:none;">
  <div class="login-mark"><svg viewBox="0 0 100 100" fill="none"><path d="M28 52l16 16 28-34" stroke="white" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <div>
    <div class="login-title">Done</div>
    <div class="login-sub" style="margin-top:8px;">Marque sua rotina, acompanhe sua constância.</div>
  </div>
  <button class="google-btn" id="google-login-btn">
    <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.6-6 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.5 5.1 29.6 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.4-.1-2.7-.4-4.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.4 18.9 12 24 12c3.1 0 5.8 1.1 8 3l6-6C34.5 5.1 29.6 3 24 3 15.5 3 8.2 7.9 6.3 14.7z"/><path fill="#4CAF50" d="M24 45c5.5 0 10.4-1.9 14.2-5.1l-6.6-5.4C29.6 36.4 27 37 24 37c-5.3 0-9.7-3.4-11.3-8l-6.6 5.1C8.1 40.1 15.5 45 24 45z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4.1 5.5l6.6 5.4C40.9 36.6 45 30.9 45 24c0-1.4-.1-2.7-.4-3.5z"/></svg>
    Entrar com Google
  </button>
</div>

<div id="app" style="display:none;">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark"><svg viewBox="0 0 100 100" fill="none"><path d="M28 52l16 16 28-34" stroke="white" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="brand-name">Done</div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="theme-toggle-btn" title="Alternar tema">
        <svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"/></svg>
      </button>
      <button class="icon-btn" id="edit-btn" title="Editar tarefas">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      </button>
      <button class="icon-btn" id="logout-btn" title="Sair">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      </button>
    </div>
  </header>

  <main>
    <!-- TODAY -->
    <section class="view active" id="view-today">
      <div class="today-hero">
        <div class="ring-wrap">
          <svg viewBox="0 0 80 80">
            <circle class="ring-bg" cx="40" cy="40" r="34"></circle>
            <circle class="ring-fg" id="today-ring" cx="40" cy="40" r="34" stroke-dasharray="213.6" stroke-dashoffset="213.6"></circle>
          </svg>
          <div class="ring-label" id="today-pct-label">0%</div>
        </div>
        <div>
          <div class="hero-text-date" id="today-date-label">—</div>
          <div class="hero-text-title">Seu progresso hoje</div>
          <div class="hero-text-sub" id="today-sub-label">Nenhuma tarefa ainda</div>
        </div>
      </div>
      <div id="today-list"></div>
    </section>

    <!-- HISTORY -->
    <section class="view" id="view-history">
      <div class="grid-nav">
        <div class="grid-nav-label" id="week-label">—</div>
        <div class="grid-nav-btns">
          <button class="icon-btn" id="week-prev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
          <button class="icon-btn" id="week-next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
        </div>
      </div>
      <div class="grid-scroll">
        <table class="habit-grid" id="habit-grid-table"></table>
      </div>
    </section>

    <!-- ANALYTICS -->
    <section class="view" id="view-analytics">
      <div class="stat-row">
        <div class="stat-box"><div class="num" id="stat-avg30">—</div><div class="lbl">Média 30 dias</div></div>
        <div class="stat-box"><div class="num" id="stat-streak">—</div><div class="lbl">Sequência atual</div></div>
        <div class="stat-box"><div class="num" id="stat-best">—</div><div class="lbl">Melhor dia</div></div>
      </div>
      <div class="section-title">Desempenho diário (30 dias)</div>

/* ============ PERFORMANCE CALC (weighted + weekly-goal compensation) ============ */
// Returns {possible, achieved, pct} for one specific date
function taskFraction(task, dateStr){
  if(task.type === 'numeric'){
    const v = entries[entryKey(task.id, dateStr)+':val'] || 0;
    const target = task.target_value || 1;
    return Math.max(0, Math.min(1, v/target));
  }
  return isEntryDone(task.id, dateStr) ? 1 : 0;
}
function taskCompletedForGoal(task, dateStr){
  return taskFraction(task, dateStr) >= 1;
}
function computeDayPerf(dateStr){
  const date = new Date(dateStr+'T00:00:00');
  const weekStart = startOfWeek(date);
  let possible = 0, achieved = 0;
  tasks.forEach(task=>{
    if(task.created_at.slice(0,10) > dateStr) return; // task didn't exist yet
    if(!task.weekly_goal){
      possible += task.weight;
      achieved += task.weight * taskFraction(task, dateStr);
    } else {
      // count completions from week start up to (not including) this date
      let priorCount = 0;
      for(let i=0; i<7; i++){
        const d = addDays(weekStart, i);
        if(d >= date) break;
        if(taskCompletedForGoal(task, fmtDate(d))) priorCount++;
      }
      if(priorCount >= task.weekly_goal) return; // compensated, doesn't count today
      possible += task.weight;
      achieved += task.weight * taskFraction(task, dateStr);
    }
  });
  const pct = possible === 0 ? 100 : Math.round((achieved/possible)*100);
  return { possible, achieved, pct };
}

// weekly completions so far (for pill display)
function weekCompletionCount(task, refDate){
  const weekStart = startOfWeek(refDate);
  let c = 0;
  for(let i=0;i<7;i++){
    const d = addDays(weekStart, i);
    if(d > refDate) break;
    if(taskCompletedForGoal(task, fmtDate(d))) c++;
  }
  return c;
}

/* ============ TOGGLE ENTRY ============ */
async function toggleEntry(taskId, dateStr){
  const task = tasks.find(t=>t.id===taskId);
  if(task && task.type === 'numeric'){
    const key = entryKey(taskId, dateStr);
    const current = entries[key+':val'] || 0;
    const input = prompt(`Valor de "${task.name}" (meta: ${task.target_value}):`, current);
    if(input === null) return;
    const numVal = parseFloat(input.replace(',','.'));
    if(isNaN(numVal) || numVal < 0){ showToast('Valor inválido'); return; }
    const done = numVal >= task.target_value;
    entries[key] = done; entries[key+':val'] = numVal; // optimistic
    renderAll();
    const { error } = await sb.from('entries').upsert({
      task_id: taskId, date: dateStr, done, value: numVal, user_id: currentUser.id
    }, { onConflict: 'task_id,date' });
    if(error){ console.error(error); showToast('Erro ao salvar'); }
    return;
  }
  const key = entryKey(taskId, dateStr);
  const newVal = !entries[key];
  entries[key] = newVal; // optimistic
  renderAll();
  const { error } = await sb.from('entries').upsert({
    task_id: taskId, date: dateStr, done: newVal, value: null, user_id: currentUser.id
  }, { onConflict: 'task_id,date' });
  if(error){ console.error(error); entries[key] = !newVal; renderAll(); showToast('Erro ao salvar'); }
}

/* ============ RENDER: HISTORY GRID ============ */
function renderHistory(){
  const base = addDays(startOfWeek(new Date()), weekOffset*7);
  const days = [...Array(7)].map((_,i)=>addDays(base,i));
  const ts = todayStr();

  document.getElementById('week-label').textContent = weekOffset === 0
    ? 'Esta semana'
    : days[0].toLocaleDateString('pt-BR',{day:'2-digit',month:'short'}) + ' – ' + days[6].toLocaleDateString('pt-BR',{day:'2-digit',month:'short'});

  const table = document.getElementById('habit-grid-table');
  if(tasks.length === 0){
    table.innerHTML = '';
    return;
  }

  let head = '<tr><th class="col-task"></th>' + days.map(d=>{
    const isToday = fmtDate(d) === ts;
    return `<th class="day-head ${isToday?'today':''}"><span class="dow">${DOW[d.getDay()]}</span><span class="dnum">${d.getDate()}</span></th>`;
  }).join('') + '</tr>';

  let pctRow = '<tr class="pct-row"><td class="col-task">Desempenho</td>' + days.map(d=>{
    const future = d > new Date();
    const p = future ? null : computeDayPerf(fmtDate(d));
    return `<td>${p===null? '–' : p.pct+'%'}</td>`;
  }).join('') + '</tr>';

  let rows = tasks.map(task=>{
    const isNumeric = task.type === 'numeric';
    const cells = days.map(d=>{
      const dateStr = fmtDate(d);
      const future = d > new Date();
      const done = isEntryDone(task.id, dateStr);
      const val = entries[entryKey(task.id, dateStr)+':val'];
      const inner = isNumeric ? `<span style="font-size:11px;font-weight:700;">${val!==undefined?val:'–'}</span>` : checkSvg();
      return `<td class="grid-cell"><div class="grid-check ${done?'done':''} ${future?'future':''}" style="background:${done?task.color:''};" data-task="${task.id}" data-date="${dateStr}">${inner}</div></td>`;
    }).join('');
    return `<tr><td class="col-task" style="border-left:3px solid ${task.color};"><div class="task-name"><span class="dot" style="background:${task.color}"></span>${escapeHtml(task.name)}</div></td>${cells}</tr>`;
  }).join('');

  table.innerHTML = head + pctRow + rows;
  table.querySelectorAll('.grid-check:not(.future)').forEach(el=>{
    el.addEventListener('click', ()=> toggleEntry(el.dataset.task, el.dataset.date));
  });
}

/* ============ RENDER: ANALYTICS ============ */
let perfChartInstance = null;
function renderAnalytics(){
  const today = new Date();
  const last30 = [...Array(30)].map((_,i)=> addDays(today, -(29-i)));
  const perfs = last30.map(d=> computeDayPerf(fmtDate(d)).pct);

  const avg = Math.round(perfs.reduce((a,b)=>a+b,0)/perfs.length);
  document.getElementById('stat-avg30').textContent = avg + '%';
  document.getElementById('stat-best').textContent = Math.max(...perfs) + '%';

  // current streak: consecutive days (from today backwards) with pct >= 70%
  let streak = 0;
  for(let i=perfs.length-1; i>=0; i--){
    if(perfs[i] >= 70) streak++; else break;
  }
  document.getElementById('stat-streak').textContent = streak + 'd';

  const ctx = document.getElementById('perf-chart');
  const styles = getComputedStyle(document.documentElement);
  const accent = styles.getPropertyValue('--accent').trim();
  const gridColor = styles.getPropertyValue('--border').trim();
  const textColor = styles.getPropertyValue('--text-dim').trim();

  if(perfChartInstance) perfChartInstance.destroy();
  perfChartInstance = new Chart(ctx, {
    type: 'line',
    data: {
      labels: last30.map(d=> d.getDate()+'/'+(d.getMonth()+1)),
      datasets: [{
        data: perfs,
        borderColor: accent,
        backgroundColor: accent+'22',
        fill: true,
        tension: .35,
        pointRadius: 0,
        borderWidth: 2.5,
      }]
    },
    options: {
      responsive: true,
      plugins: { legend: { display:false } },
      scales: {
        y: { min:0, max:100, ticks:{ color:textColor, callback:v=>v+'%', font:{family:'Outfit'} }, grid:{ color:gridColor } },
        x: { ticks:{ color:textColor, maxTicksLimit:6, font:{family:'Outfit'} }, grid:{ display:false } }
      }
    }
  });

  // consistency ranking per task (last 30 days)
  const rankList = document.getElementById('rank-list');
  if(tasks.length === 0){
    rankList.innerHTML = '<p style="color:var(--text-faint);font-size:13.5px;">Sem tarefas ainda.</p>';
    return;
  }
  const ranked = tasks.map(task=>{
    let total=0, done=0;
    last30.forEach(d=>{
      const ds = fmtDate(d);
      if(task.created_at.slice(0,10) > ds) return;
      total++;
      if(taskCompletedForGoal(task, ds)) done++;
    });
    const pct = total===0? 0 : Math.round((done/total)*100);
    return { task, pct };
  }).sort((a,b)=> b.pct - a.pct);

  rankList.innerHTML = ranked.map(r=>`
    <div class="rank-row">
      <div class="rank-name"><span class="dot" style="background:${r.task.color}"></span><span>${escapeHtml(r.task.name)}</span></div>
      <div class="rank-bar-wrap"><div class="rank-bar" style="width:${r.pct}%;background:${r.task.color};"></div></div>
      <div class="rank-pct">${r.pct}%</div>
    </div>
  `).join('');
}

  list.querySelectorAll('[data-del]').forEach(b=> b.addEventListener('click', ()=> deleteTask(b.dataset.del)));
  list.querySelectorAll('[data-up]').forEach(b=> b.addEventListener('click', ()=> moveTask(b.dataset.up, -1)));
  list.querySelectorAll('[data-down]').forEach(b=> b.addEventListener('click', ()=> moveTask(b.dataset.down, 1)));
}

function resetForm(){
  editingTaskId = null;
  document.getElementById('form-title').textContent = 'Nova tarefa';
  document.getElementById('task-name-input').value = '';
  document.getElementById('task-weight-input').value = 1;
  document.getElementById('task-goal-input').value = '';
  document.getElementById('task-type-input').value = 'boolean';
  document.getElementById('task-target-input').value = 1;
  document.getElementById('target-value-field').style.display = 'none';
  selectedColor = COLORS[Math.floor(Math.random()*COLORS.length)];
  buildSwatches();
  document.getElementById('save-task-btn').textContent = 'Adicionar tarefa';
  document.getElementById('cancel-form-btn').style.display = 'none';
}

function loadTaskIntoForm(taskId){
  const t = tasks.find(x=>x.id===taskId);
  if(!t) return;
  editingTaskId = taskId;
  document.getElementById('form-title').textContent = 'Editar tarefa';
  document.getElementById('task-name-input').value = t.name;
  document.getElementById('task-weight-input').value = t.weight;
  document.getElementById('task-goal-input').value = t.weekly_goal || '';
  document.getElementById('task-type-input').value = t.type || 'boolean';
  document.getElementById('task-target-input').value = t.target_value || 1;
  document.getElementById('target-value-field').style.display = (t.type==='numeric') ? 'block' : 'none';
  selectedColor = t.color;
  buildSwatches();
  document.getElementById('save-task-btn').textContent = 'Salvar alterações';
  document.getElementById('cancel-form-btn').style.display = 'block';
  document.getElementById('task-name-input').scrollIntoView({behavior:'smooth', block:'center'});
}
document.getElementById('cancel-form-btn').addEventListener('click', resetForm);
document.getElementById('task-type-input').addEventListener('change', (e)=>{
  document.getElementById('target-value-field').style.display = e.target.value==='numeric' ? 'block' : 'none';
});

document.getElementById('save-task-btn').addEventListener('click', async ()=>{
  const name = document.getElementById('task-name-input').value.trim();
  const weight = parseInt(document.getElementById('task-weight-input').value) || 1;
  const goalRaw = document.getElementById('task-goal-input').value;
  const weekly_goal = goalRaw ? parseInt(goalRaw) : null;
  const type = document.getElementById('task-type-input').value;
  const target_value = type === 'numeric' ? (parseFloat(document.getElementById('task-target-input').value) || 1) : null;
  if(!name){ showToast('Digite um nome para a tarefa'); return; }

  if(editingTaskId){
    const { error } = await sb.from('tasks').update({ name, color: selectedColor, weight, weekly_goal, type, target_value }).eq('id', editingTaskId);
    if(error){ console.error(error); showToast('Erro ao salvar'); return; }
    showToast('Tarefa atualizada');
  } else {
    const { error } = await sb.from('tasks').insert({
      name, color: selectedColor, weight, weekly_goal, type, target_value, user_id: currentUser.id, sort_order: tasks.length
    });
    if(error){ console.error(error); showToast('Erro ao criar'); return; }
    showToast('Tarefa criada');
  }
  await loadTasks();
  renderExistingTasksList();
  resetForm();
  renderAll();
});

async function moveTask(taskId, dir){
  const idx = tasks.findIndex(t=>t.id===taskId);
  const swapIdx = idx + dir;
  if(swapIdx < 0 || swapIdx >= tasks.length) return;
  const a = tasks[idx], b = tasks[swapIdx];
  const aOrder = a.sort_order, bOrder = b.sort_order;
  [tasks[idx], tasks[swapIdx]] = [tasks[swapIdx], tasks[idx]];
  renderExistingTasksList();
  await Promise.all([
    sb.from('tasks').update({ sort_order: bOrder }).eq('id', a.id),
    sb.from('tasks').update({ sort_order: aOrder }).eq('id', b.id)
  ]);
  await loadTasks();
  renderExistingTasksList();
  renderAll();
}

async function deleteTask(taskId){
  if(!confirm('Remover esta tarefa? Todo o histórico dela será perdido.')) return;
  const { error } = await sb.from('tasks').delete().eq('id', taskId);
  if(error){ console.error(error); showToast('Erro ao remover'); return; }
  await loadTasks();
  renderExistingTasksList();
  renderAll();
  showToast('Tarefa removida');
}

/* ============ PWA (manifest + service worker, inline, single-file) ============ */
(function setupPWA(){
  const manifest = {
    name: "Done", short_name: "Done", start_url: ".", display: "standalone",
    background_color: "#0a0e16", theme_color: "#0a0e16",
    icons: [{
      src: "data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="22" fill="%233b82f6"/><path d="M28 52l16 16 28-34" stroke="white" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>'),
      sizes: "512x512", type: "image/svg+xml"
    }]
  };
  const blob = new Blob([JSON.stringify(manifest)], {type:'application/json'});
  const link = document.createElement('link');
  link.rel = 'manifest'; link.href = URL.createObjectURL(blob);
  document.head.appendChild(link);
})();

/* ============ INIT ============ */
initTheme();
initAuth();
</script>
